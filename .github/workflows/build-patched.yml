name: Build patched Prism Launcher

on:
  workflow_dispatch:
    inputs:
      upstream_ref:
        description: "Build a specific upstream tag/branch (e.g. 11.1.1, develop). Empty = track upstream releases automatically."
        required: false
        default: ""
      qt_version:
        description: "Force a Qt version (e.g. 6.10.2). Empty = use the tag's own recipe."
        required: false
        default: ""
      force_rebuild:
        description: "Rebuild even if a release for this tag already exists (overwrites it)."
        required: false
        type: boolean
        default: false

  schedule:
    - cron: "0 6 * * *"

permissions:
  contents: write

concurrency:
  group: build-patched
  cancel-in-progress: false

jobs:
  # Kit-update nudge: compares this copy's KIT-VERSION against the template's
  # and keeps one "Template update available" issue in step. Runs FIRST, in
  # parallel with everything else, so an out-of-date copy is told within a
  # minute of starting a run instead of after the compiler finishes. It
  # doesn't gate or delay the build and never turns a run red (the script is
  # fail-soft on purpose).
  kit-update-check:
    if: ${{ vars.no_binaries != 'true' && vars.kit_updates_off != 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    env:
      TEMPLATE_SOURCE: FMHYHelper/PrismLauncherOfflinePatch
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Check out the kit files
        uses: actions/checkout@v4

      - name: Compare kit version against template
        shell: pwsh
        run: ./scripts/notify-kit-update.ps1

  decide:
    runs-on: ubuntu-latest
    outputs:
      builds: ${{ steps.decide.outputs.builds }}
      has_builds: ${{ steps.decide.outputs.has_builds }}
    steps:
      - name: Check out template
        uses: actions/checkout@v4
        with:
          path: kit

      - id: decide
        name: Decide what to build
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ github.token }}
          # true when this repository publishes releases; repositories created
          # from the template do not define the no_binaries variable, so they
          # publish. The template itself sets it and stays binary-free.
          PRISM_PUBLISH: ${{ vars.no_binaries != 'true' }}
          # Which platforms to build (the repositories variable `platforms`):
          # comma or space separated subset of windows,linux,macos, or empty /
          # 'all' for every platform. Lets cost-sensitive copies (e.g. private
          # repositories running macOS runners) slim the matrix down.
          KIT_PLATFORMS: ${{ vars.platforms || '' }}
          INPUT_REF: ${{ inputs.upstream_ref }}
          INPUT_QT: ${{ inputs.qt_version }}
          INPUT_FORCE: ${{ inputs.force_rebuild }}
        run: |
          $force = $false
          if ($env:INPUT_FORCE -eq 'true') { $force = $true }
          & ./kit/scripts/decide.ps1 -UpstreamRef $env:INPUT_REF -QtOverride $env:INPUT_QT -Force:$force -OutputFile $env:GITHUB_OUTPUT

  build:
    needs: decide
    if: ${{ needs.decide.outputs.has_builds == 'true' }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.decide.outputs.builds) }}
    runs-on: ${{ matrix.os }}
    env:
      PRISM_TAG: ${{ matrix.tag }}
      # The macOS preset builds a universal (arm64 + x86_64) binary; the
      # deployment target comes from the tag's own matrix.
      MACOSX_DEPLOYMENT_TARGET: ${{ matrix.macosx_target }}
      PRESET: ${{ matrix.preset }}
      BUILD_PLATFORM: official
    steps:
      - name: Check out template
        uses: actions/checkout@v4
        with:
          path: kit

      - name: Clone upstream at ${{ matrix.tag }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          git init -q .
          git remote add origin https://github.com/PrismLauncher/PrismLauncher.git
          $ref = $env:PRISM_TAG
          git fetch -q --depth 1 origin "refs/tags/$ref"
          if ($LASTEXITCODE -ne 0) {
            Write-Host "Tag not found, trying branch $ref"
            git fetch -q --depth 1 origin "refs/heads/$ref"
            if ($LASTEXITCODE -ne 0) { throw "Upstream ref $ref not found" }
          }
          git checkout -q --detach FETCH_HEAD
          git submodule update --init --recursive --depth 1
          Write-Host "Cloned PrismLauncher at $ref (commit $(git rev-parse --short HEAD))"

      - name: Apply patches
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $patches = Get-ChildItem kit/patches -Filter '*.patch' | Sort-Object Name
          if ($patches.Count -eq 0) { throw "No patch files found in kit/patches" }
          foreach ($p in $patches) {
            Write-Host "Checking $($p.Name)"
            git apply --check --ignore-whitespace $p.FullName
            git apply --ignore-whitespace $p.FullName
            Write-Host "Applied $($p.Name)"
          }

      - name: Set up build dependencies (the tag's own recipe)
        uses: ./.github/actions/setup-dependencies
        with:
          build-type: Release
          artifact-name: ${{ matrix.artifact_name }}
          vcvars-arch: ${{ matrix.vcvars }}
          qt-version: ${{ matrix.qt_version }}

      - name: Configure (cmake --preset ${{ matrix.preset }})
        shell: pwsh
        run: cmake --preset $env:PRESET

      - name: Build
        shell: pwsh
        run: cmake --build --preset $env:PRESET --config Release --parallel

      - name: Package (Linux)
        if: ${{ runner.os == 'Linux' }}
        uses: ./.github/actions/package/linux
        with:
          version: ${{ matrix.tag }}
          build-type: Release
          artifact-name: ${{ matrix.artifact_name }}
          qt-version: ${{ matrix.qt_version }}

      - name: Package (macOS)
        if: ${{ runner.os == 'macOS' }}
        uses: ./.github/actions/package/macos
        with:
          version: ${{ matrix.tag }}
          build-type: Release
          artifact-name: ${{ matrix.artifact_name }}

      - name: Package (Windows)
        if: ${{ runner.os == 'Windows' }}
        uses: ./.github/actions/package/windows
        env:
          # Without Azure Trusted Signing credentials the tag's own packaging
          # action skips code signing with a warning; it never fails the run.
          CI_HAS_ACCESS_TO_AZURE: ${{ vars.CI_HAS_ACCESS_TO_AZURE || '' }}
        with:
          version: ${{ matrix.tag }}
          build-type: Release
          artifact-name: ${{ matrix.artifact_name }}
          azure-client-id: ${{ secrets.AZURE_CLIENT_ID }}
          azure-tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          azure-subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Stage release assets
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $tag = $env:PRISM_TAG
          New-Item -ItemType Directory -Force -Path out | Out-Null
          if ($env:RUNNER_OS -eq 'Windows') {
            $exe = Get-ChildItem build -Recurse -File | Where-Object { $_.Name -ieq 'prismlauncher.exe' } | Select-Object -First 1
            if ($null -eq $exe) { throw "prismlauncher.exe not found in build output" }
            Copy-Item $exe.FullName "out/PrismLauncher.exe"
            if (-not (Test-Path install-portable)) { throw "install-portable folder not produced by packaging" }
            Compress-Archive -Path (Join-Path (Get-Location) 'install-portable/*') -DestinationPath (Join-Path (Get-Location) "out/PrismLauncher-Windows-MSVC-Portable-$tag.zip")
          }
          elseif ($env:RUNNER_OS -eq 'Linux') {
            $appimage = Get-ChildItem -File | Where-Object { $_.Name -like "PrismLauncher-Linux-*x86_64.AppImage" } | Select-Object -First 1
            if ($null -eq $appimage) { throw "AppImage not found in workspace" }
            Move-Item $appimage.FullName "out/PrismLauncher-Linux-x86_64-$tag.AppImage"
            $tarball = Get-ChildItem -File | Where-Object { $_.Name -eq 'PrismLauncher-portable.tar.gz' } | Select-Object -First 1
            if ($null -eq $tarball) { throw "portable tarball not found in workspace" }
            Move-Item $tarball.FullName "out/PrismLauncher-Linux-Qt6-Portable-$tag.tar.gz"
          }
          else {
            $dmg = Get-ChildItem -File -Filter "PrismLauncher.dmg" | Select-Object -First 1
            if ($null -eq $dmg) { throw "DMG not found in workspace" }
            Move-Item $dmg.FullName "out/PrismLauncher-macOS-$tag.dmg"
          }
          Write-Host "Staged:"
          Get-ChildItem out -File | ForEach-Object { Write-Host "  $($_.Name)" }

      - name: Upload for publishing
        uses: actions/upload-artifact@v4
        with:
          # The publish job groups these directories by tag; the name format
          # is parsed by scripts/publish.ps1 - keep tag and platform suffix.
          name: release-${{ matrix.tag }}-${{ matrix.platform }}
          path: out/**
          if-no-files-found: error

  # One release per tag, containing every platform that succeeded. Collects
  # the build jobs' artifacts, appends the source patch bundle and one
  # checksums.txt, and publishes with the kit's release-notes template.
  # Publishes nothing on the template itself (no_binaries keeps it binary-free).
  publish:
    needs: [decide, build]
    if: ${{ needs.build.result == 'success' && vars.no_binaries != 'true' }}
    runs-on: ubuntu-latest
    env:
      BUILD_JSON: ${{ needs.decide.outputs.builds }}
      GH_TOKEN: ${{ github.token }}
      # This job runs in the kit checkout, not the upstream clone; the pin
      # keeps every gh call inside this repository.
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Check out template
        uses: actions/checkout@v4

      - name: Download built artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: release-*
          merge-multiple: false

      - name: Publish releases
        shell: pwsh
        run: ./scripts/publish.ps1

  finalize:
    needs: [decide, build, publish]
    if: always()
    runs-on: ubuntu-latest
    env:
      BUILD_JSON: ${{ needs.decide.outputs.builds }}
      BUILD_RESULT: ${{ needs.build.result }}
      PUBLISH_RESULT: ${{ needs.publish.result }}
    steps:
      - uses: actions/checkout@v4

      - name: Update state file
        shell: bash
        run: |
          ADV=""
          if [ "$BUILD_RESULT" = "success" ]; then
            # On the template itself the publish job is skipped (it must not
            # host binaries); that still counts as a complete run there.
            if [ "$PUBLISH_RESULT" = "success" ] || [ "$PUBLISH_RESULT" = "skipped" ]; then
              ADV="--advance"
            fi
          fi
          pwsh ./scripts/update-state.ps1 -BuildsJson "$BUILD_JSON" $ADV

      - name: Commit state heartbeat
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .state/last-build.json
          if git diff --cached --quiet; then
            echo "state unchanged; nothing to commit"
            exit 0
          fi
          git commit -m "state: automatic upstream heartbeat"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin HEAD
